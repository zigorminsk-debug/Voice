name: Android CI and releases

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  debug-build:
    name: Debug build, lint, and tests
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Build, lint, and run unit tests
        run: ./gradlew --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        with:
          name: voice-commander-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and publish release APK
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Validate release tag and version
        id: release-version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          else
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example v1.2.3)."
            exit 1
          fi

          version_code=$((1000000 + GITHUB_RUN_NUMBER))
          if (( version_code > 2100000000 )); then
            echo "::error::Generated Android versionCode exceeds Android's supported limit."
            exit 1
          fi

          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Decode permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing="$missing ANDROID_KEY_ALIAS"
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing="$missing ANDROID_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::error::Configure these GitHub Actions secrets before creating a release:$missing"
            exit 1
          fi

          keystore="$RUNNER_TEMP/voice-release-key.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
          VERSION_CODE: ${{ steps.release-version.outputs.version_code }}
        run: ./gradlew --no-daemon --stacktrace lintRelease testReleaseUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Create updater manifest
        env:
          VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
          VERSION_CODE: ${{ steps.release-version.outputs.version_code }}
        run: |
          printf '{\n  "versionName": "%s",\n  "versionCode": %s\n}\n' \
            "$VERSION_NAME" "$VERSION_CODE" > "$RUNNER_TEMP/update.json"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.release-version.outputs.version_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/update.json" \
            --verify-tag \
            --title "Voice Commander $VERSION_NAME" \
            --generate-notes
